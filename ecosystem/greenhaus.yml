# Applied on top of docker-compose.yml and docker-compose.auth.yml: the Greenhaus services share the broker of the
# ecosystem (Orderflow's, on host port 5672) and take their Pulse token from the shared realm (PULSE_* variables, set by up.ps1).
services:
  rabbitmq:
    profiles: !override [own-broker]
  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RabbitMq__Host: host.docker.internal
      # The control loop looks every few seconds instead of every 30, so the check does not wait long.
      Automation__Interval: "00:00:05"
    depends_on: !override
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
  billing:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RabbitMq__Host: host.docker.internal
    depends_on: !override
      billing-db:
        condition: service_healthy
      keycloak:
        condition: service_started
  fulfilment:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RabbitMq__Host: host.docker.internal
      Auth__Mode: Keycloak
      Auth__Authority: http://keycloak:8080/realms/greenhaus
      Auth__Issuer: http://localhost:8181/realms/greenhaus
      Auth__RequireHttpsMetadata: "false"
    depends_on: !override
      fulfilment-db:
        condition: service_healthy
      keycloak:
        condition: service_started