name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and validate contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@latest lint contracts/openapi/*.yaml

      - name: Validate AsyncAPI
        run: |
          for f in contracts/asyncapi/*.yaml; do
            npx --yes @asyncapi/cli@latest validate "$f"
          done

      - name: Check the species catalog
        run: |
          jq -e '.species | length >= 30' data/species.json
          jq -e '[.species[].id] | (length == (unique | length))' data/species.json

  mock-server:
    name: Mock server and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Test the mock against the contract
        run: dotnet test mock-server/GreenhausMock.slnx --configuration Release
      - name: Build the container image
        run: docker build -f mock-server/Dockerfile -t greenhaus-mock .

  api:
    name: API service and domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Domain rules
        run: dotnet test tests/Greenhaus.Domain.Tests --configuration Release
      - name: Service against a real PostgreSQL and the contract
        run: dotnet test tests/Greenhaus.Api.Tests --configuration Release
      - name: Build the container image
        run: docker build -f src/Greenhaus.Api/Dockerfile -t greenhaus-api .

  ui:
    name: Design system and Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @greenhaus/ui
      - run: npm run lint -w @greenhaus/ui
      - name: Install the browser for the story tests
        run: npx playwright install --with-deps chromium
      - name: Run the stories as tests, including accessibility
        run: npm test -w @greenhaus/ui
      - run: npm run build-storybook -w @greenhaus/ui

  web:
    name: Web app end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @greenhaus/web
      - run: npm run lint -w @greenhaus/web
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Start the mock backend
        run: |
          docker compose up -d --build mock
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8090/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "the mock did not become healthy" >&2
          exit 1
      - name: Run the end-to-end tests, including accessibility
        run: npm run e2e -w @greenhaus/web
      - name: Stop the mock
        if: always()
        run: docker compose down
