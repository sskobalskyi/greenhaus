name: greenhaus

services:
  # Contract-conformant mock of the Greenhaus API, on the port the contract names.
  mock:
    build:
      context: .
      dockerfile: mock-server/Dockerfile
    ports:
      - "8090:8080"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    profiles: [real]
    environment:
      POSTGRES_USER: greenhaus
      POSTGRES_PASSWORD: greenhaus
      POSTGRES_DB: greenhaus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenhaus"]
      interval: 3s
      retries: 20
    volumes:
      - greenhaus-db:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: [real]
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  # The real service. `docker compose --profile real up --build api` serves the same contract as the mock on :8091.
  # Auth__Mode=Development trusts the X-User-Id header, which is for this machine only. Use Keycloak otherwise.
  api:
    build:
      context: .
      dockerfile: src/Greenhaus.Api/Dockerfile
    profiles: [real]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__Greenhaus: Host=postgres;Database=greenhaus;Username=greenhaus;Password=greenhaus
      Auth__Mode: Development
      RabbitMq__Host: rabbitmq
      RabbitMq__User: guest
      RabbitMq__Password: guest
      # The device platform. Point it at a running Pulse, with a service token (role pulse-service).
      Pulse__BaseUrl: ${PULSE_URL:-http://host.docker.internal:5080/api/pulse/v2}
      Pulse__StaticToken: ${PULSE_TOKEN:-}
      # Or a client-credentials token, for example from Pulse's Keycloak (see the README).
      Pulse__TokenUrl: ${PULSE_TOKEN_URL:-}
      Pulse__ClientId: ${PULSE_CLIENT_ID:-}
      Pulse__ClientSecret: ${PULSE_CLIENT_SECRET:-}
      # The pot assistant is Docs-Brain. Nothing is called until a token source is set: DOCSBRAIN_TOKEN_URL with the
      # client credentials of `greenhaus-assistant` in the shared realm, or a fixed DOCSBRAIN_TOKEN for local runs.
      DocsBrain__BaseUrl: ${DOCSBRAIN_URL:-http://host.docker.internal:5090}
      DocsBrain__StaticToken: ${DOCSBRAIN_TOKEN:-}
      DocsBrain__TokenUrl: ${DOCSBRAIN_TOKEN_URL:-}
      DocsBrain__ClientId: ${DOCSBRAIN_CLIENT_ID:-}
      DocsBrain__ClientSecret: ${DOCSBRAIN_CLIENT_SECRET:-}
    ports:
      - "8091:8080"
    restart: unless-stopped

  billing-db:
    image: postgres:17-alpine
    profiles: [real]
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing"]
      interval: 3s
      retries: 20
    volumes:
      - billing-db:/var/lib/postgresql/data

  # The real billing service, same contract as the mock's billing part, on :8092 with its own database.
  billing:
    build:
      context: .
      dockerfile: src/Greenhaus.Billing/Dockerfile
    profiles: [real]
    depends_on:
      billing-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__Billing: Host=billing-db;Database=billing;Username=billing;Password=billing
      Auth__Mode: Development
      RabbitMq__Host: rabbitmq
      RabbitMq__User: guest
      RabbitMq__Password: guest
      # Shorten these to watch renewals and the grace period of a returned order run in seconds, for example 00:00:20.
      Billing__Period: ${BILLING_PERIOD:-30.00:00:00}
      Billing__Grace: ${BILLING_GRACE:-7.00:00:00}
      # A failed payment is retried every RETRY, and a subscription still past due after DUNNING is cancelled.
      Billing__RetryInterval: ${BILLING_RETRY:-1.00:00:00}
      Billing__DunningPeriod: ${BILLING_DUNNING:-7.00:00:00}
      Billing__TickInterval: ${BILLING_TICK:-00:00:30}
    ports:
      - "8092:8080"
    restart: unless-stopped

  fulfilment-db:
    image: postgres:17-alpine
    profiles: [real]
    environment:
      POSTGRES_USER: fulfilment
      POSTGRES_PASSWORD: fulfilment
      POSTGRES_DB: fulfilment
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfilment"]
      interval: 3s
      retries: 20
    volumes:
      - fulfilment-db:/var/lib/postgresql/data

  # The fulfilment service on :8093: allocates devices for ordered kits, tells Pulse when they ship, and serves the packing bundle.
  fulfilment:
    build:
      context: .
      dockerfile: src/Greenhaus.Fulfilment/Dockerfile
    profiles: [real]
    depends_on:
      fulfilment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__Fulfilment: Host=fulfilment-db;Database=fulfilment;Username=fulfilment;Password=fulfilment
      # Seals the claim tokens and device passwords in the database. This default is a development value that is published in this
      # file: set FULFILMENT_SECRETS_KEY (base64 of 32 random bytes) for anything that is not a local run.
      Fulfilment__SecretsKey: ${FULFILMENT_SECRETS_KEY:-Z3JlZW5oYXVzLWRldi1mdWxmaWxtZW50LXNlY3JldCE=}
      Auth__Mode: Development
      RabbitMq__Host: rabbitmq
      RabbitMq__User: guest
      RabbitMq__Password: guest
      Web__BaseUrl: ${WEB_URL:-http://localhost:5174}
      Pulse__BaseUrl: ${PULSE_URL:-http://host.docker.internal:5080/api/pulse/v2}
      Pulse__StaticToken: ${PULSE_TOKEN:-}
      Pulse__TokenUrl: ${PULSE_TOKEN_URL:-}
      Pulse__ClientId: ${PULSE_CLIENT_ID:-}
      Pulse__ClientSecret: ${PULSE_CLIENT_SECRET:-}
    ports:
      - "8093:8080"
    restart: unless-stopped

volumes:
  greenhaus-db:
  billing-db:
  fulfilment-db:
