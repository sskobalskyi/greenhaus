name: greenhaus

services:
  # Contract-conformant mock of the Greenhaus API, on the port the contract names.
  mock:
    build:
      context: .
      dockerfile: mock-server/Dockerfile
    ports:
      - "8090:8080"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    profiles: [real]
    environment:
      POSTGRES_USER: greenhaus
      POSTGRES_PASSWORD: greenhaus
      POSTGRES_DB: greenhaus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenhaus"]
      interval: 3s
      retries: 20
    volumes:
      - greenhaus-db:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: [real]
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  # The real service. `docker compose --profile real up --build api` serves the same contract as the mock on :8091.
  # Auth__Mode=Development trusts the X-User-Id header, which is for this machine only. Use Keycloak otherwise.
  api:
    build:
      context: .
      dockerfile: src/Greenhaus.Api/Dockerfile
    profiles: [real]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__Greenhaus: Host=postgres;Database=greenhaus;Username=greenhaus;Password=greenhaus
      Auth__Mode: Development
      RabbitMq__Host: rabbitmq
      RabbitMq__User: guest
      RabbitMq__Password: guest
      # The device platform. Point it at a running Pulse, with a service token (role pulse-service).
      Pulse__BaseUrl: ${PULSE_URL:-http://host.docker.internal:5080/api/pulse/v2}
      Pulse__StaticToken: ${PULSE_TOKEN:-}
      # Or a client-credentials token, for example from Pulse's Keycloak (see the README).
      Pulse__TokenUrl: ${PULSE_TOKEN_URL:-}
      Pulse__ClientId: ${PULSE_CLIENT_ID:-}
      Pulse__ClientSecret: ${PULSE_CLIENT_SECRET:-}
    ports:
      - "8091:8080"
    restart: unless-stopped

volumes:
  greenhaus-db:
